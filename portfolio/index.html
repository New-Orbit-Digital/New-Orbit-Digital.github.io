<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Justin Bost</title>
<meta name="description" content="Apps, games, tools, and analysis built by Justin Bost — filterable by status and type.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portfolio.css">
<style>
:root{
  --abyss:#0F1E22;
  --hull:#16292E;
  --rule:#2F5058;
  --dim:#7E9498;
  --bone:#E6E4DC;
  --haze:#A8BABD;
  --brass:#E0AE4D;
  --verdigris:#5FC7B1;

  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  --rail:16rem;
  --gutter:clamp(1.5rem,5vw,5rem);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--abyss);color:var(--bone);
  font-family:var(--body);font-size:clamp(1rem,0.95rem + 0.2vw,1.125rem);
  font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased;
}
a{color:var(--verdigris);text-decoration:none;border-bottom:1px solid rgba(95,199,177,.35);transition:border-color .18s,color .18s}
a:hover{border-bottom-color:var(--verdigris)}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.tag{font-family:var(--mono);font-size:.6875rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}

/* ---------- left rail (matches home) ---------- */
.rail{
  position:fixed;inset:0 auto 0 0;width:var(--rail);
  padding:2.5rem 0 2.5rem 2.5rem;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:10;background:var(--abyss);
}
.rail__mark{font-family:var(--display);font-variation-settings:"wdth" 100;font-weight:800;font-size:1.0625rem;line-height:1.5;letter-spacing:.34em;text-transform:uppercase;margin:0}
.rail__mark a{color:var(--bone);border:0}
.rail__mark span{display:block;color:var(--brass)}
.rail__nav{display:flex;flex-direction:column;gap:.55rem}
.rail__nav a{font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);border:0;transition:color .18s}
.rail__nav a:hover,.rail__nav a:focus-visible,.rail__nav a[aria-current="page"]{color:var(--bone)}
.rail__nav a[aria-current="page"]::before{content:"— ";color:var(--brass)}
.rail__foot{font-family:var(--mono);font-size:.625rem;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;line-height:1.9}

/* ---------- shell ---------- */
.page{margin-left:var(--rail);padding:0 var(--gutter)}
.wrap{max-width:68rem;margin:0 auto}

/* ---------- intro ---------- */
.intro{padding:clamp(3.5rem,9vh,6rem) 0 2.5rem}
.intro__title{
  font-family:var(--display);font-variation-settings:"wdth" 75;font-weight:800;
  font-size:clamp(2.5rem,1rem + 6vw,5.5rem);line-height:.94;letter-spacing:.06em;
  text-transform:uppercase;margin:.9rem 0 1.5rem;
}
.intro__title em{font-style:normal;color:var(--brass)}
.pf-root{padding-bottom:6rem}
.intro__lede{font-family:var(--display);font-variation-settings:"wdth" 84;font-weight:400;font-size:clamp(1.125rem,1rem + .6vw,1.5rem);line-height:1.45;max-width:34ch;margin:0;color:var(--haze)}

/* ---------- responsive ---------- */
@media (max-width:60rem){
  :root{--rail:0px}
  .rail{position:static;width:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:1.25rem var(--gutter);border-right:0;border-bottom:1px solid var(--rule)}
  .rail__mark{font-size:.8125rem;letter-spacing:.28em}
  .rail__mark span{display:inline}
  .rail__nav{flex-direction:row;gap:1.25rem}
  .rail__nav a:not(.keep){display:none}
  .rail__foot{display:none}
  .page{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="rail" aria-label="Site navigation">
  <p class="rail__mark"><a href="/">Justin<span>Bost</span></a></p>
  <div class="rail__nav">
    <a class="keep" href="/">Home</a>
    <a href="/#practice">Practice</a>
    <a href="/#evidence">Evidence</a>
    <a href="/#experience">Experience</a>
    <a class="keep" href="/portfolio/" aria-current="page">Portfolio</a>
    <a href="/#contact">Contact</a>
  </div>
  <p class="rail__foot">Chapel&nbsp;Hill,&nbsp;NC<br>+&nbsp;Remote</p>
</nav>

<main class="page">
<div class="wrap">

  <header class="intro">
    <span class="tag">Portfolio</span>
    <h1 class="intro__title">Things<br><em>I build</em></h1>
    <p class="intro__lede">Apps, games, tools, and analysis — some in daily use, some still on the bench.</p>
  </header>

  <div class="pf-root" data-portfolio data-src="projects.json" data-hash></div>

</div>
</main>

<script src="portfolio.js" defer></script>
</body>
</html>
